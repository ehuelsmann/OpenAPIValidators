name: CI

permissions:
  contents: read

on:
  push:
    paths-ignore:
      - '*.md'
      - '.all-contributorsrc'
  pull_request:
  workflow_dispatch:

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      code_changed: ${{ steps.filter.outputs.code_changed }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: filter
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "code_changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          base_sha="${{ github.event.before }}"
          head_sha="${{ github.sha }}"

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base_sha="${{ github.event.pull_request.base.sha }}"
            head_sha="${{ github.event.pull_request.head.sha }}"
          fi

          if [[ -z "$base_sha" || "$base_sha" == "0000000000000000000000000000000000000000" ]]; then
            echo "code_changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          code_changed=false
          while IFS= read -r file; do
            [[ -z "$file" ]] && continue

            case "$file" in
              *.md|.all-contributorsrc)
                ;;
              *)
                code_changed=true
                break
                ;;
            esac
          done < <(git diff --name-only "$base_sha" "$head_sha")

          echo "code_changed=$code_changed" >> "$GITHUB_OUTPUT"

  Test:
    needs: changes
    if: needs.changes.outputs.code_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20

      - run: corepack enable

      - run: yarn --version

      - run: yarn install --immutable

      - run: yarn test:ci

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
        if: success()

  Done:
    needs:
      - changes
      - Test
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require Test to succeed or be skipped
        shell: bash
        run: |
          if [[ "${{ needs.changes.result }}" != "success" ]]; then
            echo "changes job finished with ${{ needs.changes.result }}"
            exit 1
          fi

          if [[ "${{ needs.Test.result }}" != "success" && "${{ needs.Test.result }}" != "skipped" ]]; then
            echo "Test job finished with ${{ needs.Test.result }}"
            exit 1
          fi
