name: CI

permissions:
  contents: read

on:
  push:
    paths-ignore:
      - '*.md'
      - '.all-contributorsrc'
  pull_request:
    paths-ignore:
      - '*.md'
      - '.all-contributorsrc'
  workflow_dispatch:

jobs:
  Test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 20

      - run: corepack enable

      - run: yarn --version

      - run: yarn install --immutable

      - run: yarn test:ci
      
      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
        if: success()
